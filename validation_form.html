<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Registration Form</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5 mb-5">
    <div class="card shadow mx-auto" style="max-width: 700px;">
        
        <div class="card-header bg-primary text-white text-center">
            <h2>Registration Form</h2>
            <p class="mb-0">Create your account</p>
        </div>

        <div class="card-body p-4">

            <form id="registrationForm">

                <!-- Name -->
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" id="name" class="form-control"
                           placeholder="Enter your full name">
                    <div class="text-danger" id="nameError"></div>
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" id="email" class="form-control"
                           placeholder="Enter your email">
                    <div class="text-danger" id="emailError"></div>
                </div>

                <!-- Mobile -->
                <div class="mb-3">
                    <label class="form-label">Mobile Number</label>
                    <input type="text" id="mobile" class="form-control"
                           placeholder="Enter 10-digit mobile number">
                    <div class="text-danger" id="mobileError"></div>
                </div>

                <!-- Date of Birth -->
                <div class="mb-3">
                    <label class="form-label">Date of Birth</label>
                    <input type="date" id="dob" class="form-control">
                    <div class="text-danger" id="dobError"></div>
                </div>

                <!-- Gender -->
                <div class="mb-3">
                    <label class="form-label">Gender</label><br>

                    <div class="form-check form-check-inline">
                        <input type="radio" name="gender"
                               class="form-check-input" value="Male">
                        <label class="form-check-label">Male</label>
                    </div>

                    <div class="form-check form-check-inline">
                        <input type="radio" name="gender"
                               class="form-check-input" value="Female">
                        <label class="form-check-label">Female</label>
                    </div>

                    <div class="form-check form-check-inline">
                        <input type="radio" name="gender"
                               class="form-check-input" value="Other">
                        <label class="form-check-label">Other</label>
                    </div>

                    <div class="text-danger" id="genderError"></div>
                </div>

                <!-- Password -->
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" id="password" class="form-control"
                           placeholder="Enter password">

                    <div class="progress mt-2" style="height: 5px;">
                        <div id="strengthBar" class="progress-bar"></div>
                    </div>

                    <small id="strengthText"></small>
                    <div class="text-danger" id="passwordError"></div>
                </div>

                <!-- Confirm Password -->
                <div class="mb-3">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" id="confirmPassword"
                           class="form-control"
                           placeholder="Re-enter password">
                    <div class="text-danger" id="confirmError"></div>
                </div>

                <!-- Terms -->
                <div class="form-check mb-3">
                    <input type="checkbox" id="terms"
                           class="form-check-input">

                    <label class="form-check-label">
                        I agree to the Terms and Conditions
                    </label>

                    <div class="text-danger" id="termsError"></div>
                </div>

                <!-- Buttons -->
                <div class="text-center">
                    <button type="submit" class="btn btn-primary px-4">
                        Register
                    </button>

                    <button type="reset" class="btn btn-secondary px-4"
                            onclick="resetForm()">
                        Reset
                    </button>
                </div>

            </form>

        </div>
    </div>
</div>


<script>

document.getElementById("password").addEventListener("input", function () {

    let password = this.value;
    let bar = document.getElementById("strengthBar");
    let text = document.getElementById("strengthText");

    let strength = 0;

    if (password.length >= 6) strength++;
    if (/[A-Z]/.test(password)) strength++;
    if (/[0-9]/.test(password)) strength++;
    if (/[^A-Za-z0-9]/.test(password)) strength++;

    if (password.length == 0) {
        bar.style.width = "0%";
        text.innerHTML = "";
    }
    else if (strength <= 1) {
        bar.style.width = "25%";
        text.innerHTML = "Weak Password";
    }
    else if (strength == 2) {
        bar.style.width = "50%";
        text.innerHTML = "Medium Password";
    }
    else if (strength == 3) {
        bar.style.width = "75%";
        text.innerHTML = "Good Password";
    }
    else {
        bar.style.width = "100%";
        text.innerHTML = "Strong Password";
    }
});


document.getElementById("registrationForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    let valid = true;

    // Get values
    let name = document.getElementById("name").value.trim();
    let email = document.getElementById("email").value.trim();
    let mobile = document.getElementById("mobile").value.trim();
    let dob = document.getElementById("dob").value;
    let password = document.getElementById("password").value;
    let confirmPassword =
        document.getElementById("confirmPassword").value;

    // Name validation
    if (!/^[A-Za-z ]{3,}$/.test(name)) {
        document.getElementById("nameError").innerHTML =
            "Enter a valid name.";
        valid = false;
    } else {
        document.getElementById("nameError").innerHTML = "";
    }

    // Email validation
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        document.getElementById("emailError").innerHTML =
            "Enter a valid email address.";
        valid = false;
    } else {
        document.getElementById("emailError").innerHTML = "";
    }

    // Mobile validation
    if (!/^[6-9][0-9]{9}$/.test(mobile)) {
        document.getElementById("mobileError").innerHTML =
            "Enter a valid 10-digit mobile number.";
        valid = false;
    } else {
        document.getElementById("mobileError").innerHTML = "";
    }

    // Date validation
    if (dob == "") {
        document.getElementById("dobError").innerHTML =
            "Please select your date of birth.";
        valid = false;
    } else {
        document.getElementById("dobError").innerHTML = "";
    }

    // Gender validation
    let gender = document.querySelector(
        'input[name="gender"]:checked'
    );

    if (!gender) {
        document.getElementById("genderError").innerHTML =
            "Please select your gender.";
        valid = false;
    } else {
        document.getElementById("genderError").innerHTML = "";
    }

    // Password validation
    if (password.length < 6 ||
        !/[A-Z]/.test(password) ||
        !/[0-9]/.test(password)) {

        document.getElementById("passwordError").innerHTML =
            "Password must contain 6 characters, one uppercase letter and one number.";

        valid = false;

    } else {
        document.getElementById("passwordError").innerHTML = "";
    }

    // Confirm password
    if (password !== confirmPassword) {

        document.getElementById("confirmError").innerHTML =
            "Passwords do not match.";

        valid = false;

    } else {
        document.getElementById("confirmError").innerHTML = "";
    }

    // Terms
    if (!document.getElementById("terms").checked) {

        document.getElementById("termsError").innerHTML =
            "Please accept the terms and conditions.";

        valid = false;

    } else {
        document.getElementById("termsError").innerHTML = "";
    }

    // Final result
    if (valid) {
        alert("Registration Successful!");
        document.getElementById("registrationForm").reset();
    }
});


function resetForm() {
    document.getElementById("strengthBar").style.width = "0%";
    document.getElementById("strengthText").innerHTML = "";
}

</script>

</body>
</html>
